[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-disagreement"
version = "0.1.2"
description = "LLM evaluation agreement stress tests: generate deterministic synthetic reviewer disagreement and inter-annotator agreement curves."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["llm-evaluation", "inter-annotator-agreement", "synthetic-data", "annotation-quality", "reviewer-disagreement", "fleiss-kappa", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
dependencies = ["iaa-kit>=0.1.1", "numpy>=1.23"]

[project.urls]
Homepage = "https://auraone.ai/open/evalkit"
Source = "https://github.com/auraoneai/synthetic-disagreement"
Documentation = "https://github.com/auraoneai/synthetic-disagreement#readme"
Repository = "https://github.com/auraoneai/synthetic-disagreement.git"
Issues = "https://github.com/auraoneai/synthetic-disagreement/issues"
Changelog = "https://github.com/auraoneai/synthetic-disagreement/blob/main/CHANGELOG.md"

[project.scripts]
synthetic-disagreement = "synthetic_disagreement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "../iaa-kit/src"]
testpaths = ["tests"]
